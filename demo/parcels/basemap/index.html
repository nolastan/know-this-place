<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo — Lots over a basemap</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/site.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/demo/parcels/demo.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
  <script src="/demo/parcels/map.js" defer></script>
</head>
<body>
<div class="map-shell">
  <div id="map" data-mode="basemap" role="region" aria-label="Map of documented addresses in San Francisco, drawn as lots"></div>
  <div class="media-empty"><span>Loading map…</span></div>
  <a class="map-brand" href="/demo/parcels/">Know This Place</a>
  <aside class="demo-note">
    <strong>Lots over a basemap</strong>
    <p>Every documented page drawn as its lot outline, over a keyless OpenFreeMap basemap (standing in for Mapbox, whose token doesn't work on preview hosts).</p>
    <p id="zoom"></p>
    <ul id="readout"></ul>
    <p><a href="/demo/parcels/">All three prototypes</a></p>
  </aside>
</div>
</body>
</html>
