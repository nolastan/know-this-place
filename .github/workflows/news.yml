# Scheduled sweep of the news feeds for stories that name an address.
#
# Nothing here ever reaches main without a human merging it. That makes the
# branch, not main, the place where "what have we already considered?" is
# recorded — so a run first looks for the open PR a previous run left behind
# and continues on its branch. Without that, an unmerged PR would leave main's
# cursors stale, and the next run would re-fetch, re-screen and (expensively)
# re-read the same stories; worse, the feeds only carry one to five days, so
# stories in a PR left sitting would age out of the feeds and be lost rather
# than merely repeated.
name: news

on:
  schedule:
    - cron: "0 15 * * *" # daily, ~8am Pacific — after the morning news cycle
  workflow_dispatch:
    inputs:
      feed:
        description: "Poll only this feed id (empty = every open feed)."
        required: false
        default: ""

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Continue a previous run's PR if one is still open, so the cursors and
      # the queue it left behind are the ones this run starts from.
      - name: Find the open news PR, or start a branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr=$(gh pr list --state open --base main --limit 50 \
                 --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("news/"))][0] // empty')

          if [ -n "$pr" ]; then
            number=$(echo "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')
            branch=$(echo "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headRefName"])')
            echo "continuing PR #$number on $branch"
            git fetch origin main "$branch"
            git checkout -B "$branch" "origin/$branch"
            # Stay current with main so the branch does not drift into a pile of
            # conflicts. A conflict here is the agent's to resolve, not a reason
            # to skip the poll, so record it and carry on.
            if git merge --no-edit origin/main; then
              echo "merge_conflict=" >> "$GITHUB_OUTPUT"
            else
              git merge --abort
              echo "merge_conflict=1" >> "$GITHUB_OUTPUT"
            fi
            echo "pr=$number" >> "$GITHUB_OUTPUT"
          else
            git fetch origin main
            branch="news/$(date -u +%F)"
            # A branch from a cycle that was closed unmerged can still be
            # sitting on the remote under today's name; pushing to it would be
            # rejected as a non-fast-forward.
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              branch="$branch-$GITHUB_RUN_NUMBER"
            fi
            echo "no open news PR; starting $branch"
            git checkout -B "$branch" origin/main
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "merge_conflict=" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Poll the feeds
        run: |
          python3 news/tools/poll.py poll ${{ inputs.feed && format('--feed {0}', inputs.feed) || '' }}
          python3 news/tools/poll.py status

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the news agent for knowthis.place. Read news/AGENTS.md
            first — it is the rulebook — then the root AGENTS.md (privacy) and
            shared/AGENTS.md (the HTML contract).

            You are on branch ${{ steps.branch.outputs.branch }}, already
            checked out. ${{ steps.branch.outputs.pr && format('It belongs to OPEN PR #{0}, left by an earlier run — its cursors, queue files and items files are the ones you are continuing, and pushing to this branch updates that PR rather than opening a second one.', steps.branch.outputs.pr) || 'No news PR was open, so this branch is new off main and you will open the PR at the end.' }}
            ${{ steps.branch.outputs.merge_conflict && 'NOTE: merging main into this branch conflicted and was aborted. Resolve it yourself before committing — `git merge origin/main`, fix the conflicts, and say so in the PR. Generated files (sitemap.xml, shared/addresses.geojson, hub index.html/index.md) are rebuilt, never hand-merged: take main side and re-run the build scripts.' || '' }}

            The poll has already run and written today's queue to
            news/queue/<date>.json, advancing the cursors. Your job is the
            reading and extracting stages, and publishing only what earns it.
            A queue file from an earlier run that is still present is work that
            run did not finish — read it before today's.

            1. `python3 news/tools/read.py news/queue/<today>.json` to see the
               addresses in the queued stories. Whether an address already has
               a page is information, not a priority order — most will not, and
               a story about a building with no page is worth exactly as much
               as one about a building with a page. Read the queue with
               judgement: most stories will name no address, and that is
               normal.
            2. Apply the ten-year test in news/AGENTS.md. A story that merely
               mentions an address in passing gives a page nothing. Be strict:
               a thin day is a good day if the timeline stays honest.
            3. Write what survives into news/items/<feed-id>/<date>.json — the
               research findings schema, one entry per fact, `kind` describing
               what happened (sale, construction, occupancy, fire), and the
               article's headline and URL in the citation. The `description`
               there is a note for the next reader of that file; it never
               reaches a page.
               Decline any story whose HEADLINE names a private individual:
               the headline is published verbatim, so there is no rewriting
               your way past the privacy limits in the root AGENTS.md.
            4. Resolve it:
               `python3 research/tools/resolve_eas.py apply news/items/<feed>/<date>.json`
            5. For any finding that resolved to a parcel with NO page, seed the
               page — per news/AGENTS.md → "No page yet? Seed it". Write the
               parcels into research/manifests/news-<today's date>.json, taking
               the numbers and the lead street number from each finding's
               `resolution.method` (the resolver unions the addresses reached
               through retired APNs, so the story's own number is not always
               the page's), then:
                 python3 scripts/seed_pages.py seed-list --manifest research/manifests/news-<date>.json
                 python3 scripts/build_sitemap.py
                 python3 scripts/build_map_index.py
               The seeder creates only pages that don't exist and never touches
               one that does. If it refuses a parcel — a condominium unit, no
               row on the current roll — leave that finding pending with the
               reason; do not hand-write the page.
            6. Add the timeline entry to each page's data.json —
               `historical_record` with date, kind, headline, outlet, url and
               source — and bring index.html into step with it, per
               news/AGENTS.md → "Putting it on the page". The entry is the
               headline in italics and the outlet as the link, and NOTHING
               ELSE: no sentence of your own summarizing the story, and never
               an edited headline. Record in each finding's `publish.note`
               whether the page was seeded in this run, and from which
               manifest.
            7. `python3 news/tools/check.py` and `python3 scripts/validate.py`
               must both pass. Read `git diff` and confirm every change is a
               real fact about a building, and read a sample of any pages you
               seeded before committing them.
            8. If any page changed or was created, or any items file was
               written: create branch news/<today's date>, commit, push, and
               open one PR listing every page touched, every page seeded, every
               story used, and the run's counts (considered / queued / read /
               found / seeded / published). If nothing survived, commit the
               queue and cursors alone with a one-line message, and open no PR.

            Budget: this job has limited turns. Prefer three well-judged
            entries over twenty hasty ones. You do not have to finish the
            queue: a queue file is the durable worklist, so delete it only when
            it is drained, and leave it in place — committed — when it is not.
            The next run continues on this same branch and picks it up. Say in
            the PR body or your comment how much of it you read.

            Never "verify" the Street View embed — its API key is restricted to
            the production domain and always fails elsewhere.
