# Put deploy-preview links in the body of every Know This Photo PR.
#
# The app opens its PR before GitHub has given it a number, so the body it
# writes can only link the page on knowthis.place, which still shows the old
# photo (or Street View) until the PR is merged. Netlify builds every PR at a
# predictable address, `https://deploy-preview-<N>--knowthisplace.netlify.app`
# (netlify.toml), so once the number exists this workflow adds a "Preview"
# section linking each page the PR changes, and its photo, on that preview.
#
# The section sits between two markers and is rewritten in place, so running
# again (a new push, or the manual backfill below) never duplicates it. It
# does not wait for Netlify: the links are right from the start and open as
# soon as the preview has built, a few minutes after the push.
#
# Run it by hand (Actions → preview-links → Run workflow) to backfill every
# open `photo/` PR, e.g. the ones opened before this workflow existed.
name: preview-links

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-links-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: true

jobs:
  links:
    # Only the app's branches. Agents add their own preview links (AGENTS.md
    # → Git and PR conventions), choosing the pages worth looking at.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'photo/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the preview section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: python3 {0}
        run: |
          import json, os, re, subprocess

          REPO = os.environ["GH_REPO"]
          PREVIEW = "https://deploy-preview-{n}--knowthisplace.netlify.app"
          START, END = "<!-- preview-links -->", "<!-- /preview-links -->"

          def api(*args):
              out = subprocess.run(["gh", "api", *args], check=True,
                                   capture_output=True, text=True).stdout
              return json.loads(out) if out.strip() else None

          def raw(path, ref):
              return subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github.raw+json",
                   f"repos/{REPO}/contents/{path}?ref={ref}"],
                  check=True, capture_output=True, text=True).stdout

          def section(n, head):
              base = PREVIEW.format(n=n)
              files = api("--paginate", f"repos/{REPO}/pulls/{n}/files?per_page=100")
              names = {f["filename"] for f in files if f["status"] != "removed"}
              lines = []
              for name in sorted(names):
                  directory, _, leaf = name.rpartition("/")
                  if leaf not in ("data.json", "place.json"):
                      continue
                  try:
                      page = json.loads(raw(name, head))
                  except (subprocess.CalledProcessError, ValueError):
                      continue
                  path = page.get("path") or f"/{directory}/"
                  title = page.get("name") or (page.get("address") or path).split(",")[0]
                  line = f"- [{title}]({base}{path})"
                  if f"{directory}/assets/photo.jpg" in names:
                      line += f" · [photo]({base}/{directory}/assets/photo.jpg)"
                  lines.append(line)
              if not lines:
                  return None
              return "\n".join([
                  START,
                  f"**Preview:** see the change on [this PR's deploy preview]({base}/) "
                  "before merging. It opens once Netlify has built it, a few "
                  "minutes after each push.",
                  "",
                  *lines,
                  END,
              ])

          def update(pr):
              n, body = pr["number"], pr.get("body") or ""
              new = section(n, pr["head"]["sha"])
              if new is None:
                  print(f"#{n}: no page changed; leaving the body alone")
                  return
              block = re.compile(re.escape(START) + r".*?" + re.escape(END), re.S)
              if block.search(body):
                  updated = block.sub(lambda _: new, body, count=1)
              else:
                  # After the opening paragraph ("Adds a photo of …"), so the
                  # preview is the first thing a reviewer reaches.
                  first, sep, rest = body.partition("\n\n")
                  updated = f"{first}\n\n{new}\n\n{rest}" if sep else f"{body}\n\n{new}"
              if updated == body:
                  print(f"#{n}: already current")
                  return
              subprocess.run(["gh", "api", "-X", "PATCH", f"repos/{REPO}/pulls/{n}",
                              "-f", f"body={updated}"], check=True,
                             capture_output=True)
              print(f"#{n}: preview links written")

          if os.environ.get("PR"):
              update(api(f"repos/{REPO}/pulls/{os.environ['PR']}"))
          else:
              for pr in api("--paginate", f"repos/{REPO}/pulls?state=open&per_page=100"):
                  if pr["head"]["ref"].startswith("photo/") and \
                     pr["head"]["repo"] and pr["head"]["repo"]["full_name"] == REPO:
                      update(pr)
