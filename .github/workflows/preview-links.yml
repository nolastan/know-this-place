# Finish the body of every Know This Photo PR: point its page links at the
# deploy preview, and set each new photo beside Google Street View.
#
# The app puts a whole day's photos in one PR (a `photo/session-<timestamp>`
# branch, one commit per page). Each page has its own section of the body,
#
#   <!-- ktp-photo path="/…/" location="lat,lng" -->
#   ### [Page title](https://knowthis.place/…/)
#   …
#   ![Photo of Page title](…)
#   <!-- /ktp-photo -->
#
# added before the "_Sent from Know This Photo._" footer, and a retake of a
# page replaces that page's section whole. PRs from before the batching hold
# one photo and no markers; those keep working the same way, as one section.
#
# 1. Preview links. The app writes its body before it knows the PR number, so
#    it can only link the pages on knowthis.place, which still show the old
#    photo (or Street View) until the PR is merged. photo-preview.yml uploads
#    the PR's preview to `https://photo-<N>--knowthisplace.netlify.app` once
#    the photos stop coming (Netlify's own deploy previews skip photo PRs,
#    netlify.toml), so this swaps every page link for the same page on the preview. Nothing is
#    added: Stan asked for the body to stay that simple. The link is right
#    from the start and opens once the preview has built.
#
# 2. Street View. Each section's photo becomes a two-column table, the new
#    photo beside the Street View image the page would otherwise show (the
#    request site.js's <ktp-streetview> makes: 640×480, outdoor panoramas,
#    the camera turned to the page's coordinates), so a reviewer can tell at
#    a glance that each photo is of the right building. The site's Maps key
#    is restricted to knowthis.place, and GitHub fetches a body's images from
#    its own servers with no referrer, so the images are fetched here with a
#    server key (the STREET_VIEW_KEY secret: restricted to the Street View
#    Static API, with no referrer restriction) and committed to the
#    `pr-street-view` branch, one per page: `<N>-<page slug>.jpg`, or `<N>.jpg`
#    for a single-photo PR. That branch holds nothing else and is never
#    merged; a PR's images are deleted from it when the PR closes. A section
#    with no outdoor panorama keeps its one photo, as does every section when
#    the secret is missing.
#
# The table sits inside the section, so a retake (which replaces the section)
# drops it and the next run puts it back, reusing the image already on the
# branch. Running again on a finished body changes nothing. Run it by hand
# (Actions → preview-links → Run workflow) to update every open `photo/` PR.
name: preview-links

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write # the Street View images on `pr-street-view`
  pull-requests: write

concurrency:
  group: preview-links-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: true

jobs:
  links:
    # Only the app's branches. Agents add their own preview links (AGENTS.md
    # → Git and PR conventions).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'photo/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preview links and Street View comparison
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          STREET_VIEW_KEY: ${{ secrets.STREET_VIEW_KEY }}
        shell: python3 {0}
        run: |
          import base64, json, os, re, subprocess, time
          import urllib.parse, urllib.request

          REPO = os.environ["GH_REPO"]
          KEY = os.environ.get("STREET_VIEW_KEY", "")
          PREVIEW = "https://photo-{n}--knowthisplace.netlify.app"
          BRANCH = "pr-street-view"
          IMAGES = f"https://github.com/{REPO}/blob/{BRANCH}/{{name}}?raw=true"
          # A page link, and the section an early version of this workflow
          # added (removed so the body keeps only the app's links).
          PAGE_LINK = re.compile(r"\]\(https://knowthis\.place(/[^)\s]*)\)")
          OLD_SECTION = re.compile(
              r"\n*<!-- preview-links -->.*?<!-- /preview-links -->\n*", re.S)
          # One page's section, as the app writes it.
          SECTION = re.compile(
              r'<!-- ktp-photo path="([^"]*)" location="([^"]*)" -->.*?<!-- /ktp-photo -->', re.S)
          # The app's photo, alone on its line.
          PHOTO = re.compile(r"^!\[Photo of ([^\]\n]*)\]\((\S+)\)[ \t]*$", re.M)
          MARK, END = "<!-- street-view -->", "<!-- /street-view -->"

          class NotFound(Exception):
              pass

          def api(path, method="GET", data=None, paginate=False, raw=False):
              args = ["gh", "api", "-X", method, path]
              if paginate:
                  args.append("--paginate")
              if data is not None:
                  args += ["--input", "-"]
              res = subprocess.run(args, input=json.dumps(data) if data is not None else None,
                                   capture_output=True, text=True)
              if res.returncode:
                  if "HTTP 404" in res.stderr:
                      raise NotFound(path)
                  raise RuntimeError(f"{method} {path}: {res.stderr.strip()}")
              if raw:
                  return res.stdout
              return json.loads(res.stdout) if res.stdout.strip() else None

          def pages(path):
              """Every item of a paginated list (--paginate prints one array per page)."""
              out, items, dec, i = api(path, paginate=True, raw=True), [], json.JSONDecoder(), 0
              while i < len(out):
                  if out[i].isspace():
                      i += 1
                      continue
                  page, i = dec.raw_decode(out, i)
                  items += page
              return items

          # --- 1. preview links ------------------------------------------

          def preview_links(n, body):
              base = PREVIEW.format(n=n)
              updated = OLD_SECTION.sub("\n\n", body)
              return PAGE_LINK.sub(lambda m: f"]({base}{m.group(1)})", updated)

          # --- 2. Street View --------------------------------------------

          def single_photo_location(pr):
              """lat,lng from the page JSON beside a single-photo PR's photo."""
              files = api(f"repos/{REPO}/pulls/{pr['number']}/files?per_page=100")
              for f in files:
                  name = f["filename"]
                  if not name.endswith("/assets/photo.jpg"):
                      continue
                  folder = name[: -len("assets/photo.jpg")]
                  for page in ("data.json", "place.json"):
                      try:
                          meta = api(f"repos/{REPO}/contents/{urllib.parse.quote(folder + page)}"
                                     f"?ref={urllib.parse.quote(pr['head']['sha'])}")
                      except NotFound:
                          continue
                      c = json.loads(base64.b64decode(meta["content"])).get("coordinates") or {}
                      if "lat" in c and "lng" in c:
                          return f"{c['lat']},{c['lng']}"
              return None

          def street_view(location):
              """The JPEG site.js would show, or None where there is no panorama."""
              q = urllib.parse.urlencode({"location": location, "source": "outdoor", "key": KEY})
              base = "https://maps.googleapis.com/maps/api/streetview"
              with urllib.request.urlopen(f"{base}/metadata?{q}", timeout=30) as r:
                  status = json.load(r).get("status")
              if status != "OK":
                  print(f"  Street View at {location}: {status}")
                  return None
              with urllib.request.urlopen(f"{base}?size=640x480&{q}", timeout=30) as r:
                  return r.read()

          def slug(path):
              return re.sub(r"[^a-z0-9]+", "-", path.lower()).strip("-")

          def owned(n, name):
              """Whether a file on the branch is one of PR n's images."""
              return re.fullmatch(rf"{n}(-[a-z0-9-]+)?\.jpg", name) is not None

          def branch_files():
              try:
                  sha = api(f"repos/{REPO}/git/ref/heads/{BRANCH}")["object"]["sha"]
              except NotFound:
                  return None
              tree = api(f"repos/{REPO}/git/trees/{sha}")
              return {t["path"] for t in tree["tree"] if t["type"] == "blob"}

          def ensure_branch():
              if branch_files() is not None:
                  return
              # An orphan branch: it shares no history with main and is never merged.
              readme = ("Street View images for the Know This Photo PR bodies, written and "
                        "deleted by .github/workflows/preview-links.yml. Never merge this branch.\n")
              tree = api(f"repos/{REPO}/git/trees", "POST", {"tree": [
                  {"path": "README.md", "mode": "100644", "type": "blob", "content": readme}]})
              commit = api(f"repos/{REPO}/git/commits", "POST", {
                  "message": "Start the Street View image branch", "tree": tree["sha"], "parents": []})
              try:
                  api(f"repos/{REPO}/git/refs", "POST",
                      {"ref": f"refs/heads/{BRANCH}", "sha": commit["sha"]})
              except RuntimeError:
                  pass  # another run made it first

          def commit_files(changes, message):
              """One commit on the branch: {name: JPEG bytes, or None to delete}.
              Runs for other PRs move the branch too, so a refused update retries."""
              blobs = {name: api(f"repos/{REPO}/git/blobs", "POST", {
                          "content": base64.b64encode(data).decode(), "encoding": "base64"})["sha"]
                       for name, data in changes.items() if data is not None}
              entries = [{"path": name, "mode": "100644", "type": "blob", "sha": blobs.get(name)}
                         for name in changes]
              for attempt in range(6):
                  head = api(f"repos/{REPO}/git/ref/heads/{BRANCH}")["object"]["sha"]
                  base = api(f"repos/{REPO}/git/commits/{head}")["tree"]["sha"]
                  present = {t["path"] for t in api(f"repos/{REPO}/git/trees/{base}")["tree"]}
                  # Deleting a file that is already gone is an error, so leave it out.
                  todo = [e for e in entries if e["sha"] or e["path"] in present]
                  if not todo:
                      return
                  tree = api(f"repos/{REPO}/git/trees", "POST", {"base_tree": base, "tree": todo})
                  commit = api(f"repos/{REPO}/git/commits", "POST",
                               {"message": message, "tree": tree["sha"], "parents": [head]})
                  try:
                      api(f"repos/{REPO}/git/refs/heads/{BRANCH}", "PATCH",
                          {"sha": commit["sha"], "force": False})
                      return
                  except RuntimeError as e:
                      if attempt == 5:
                          raise
                      print(f"  retrying: {e}")
                      time.sleep(2 + attempt * 3)

          def delete_images(n):
              files = branch_files() or set()
              mine = sorted(f for f in files if owned(n, f))
              if mine:
                  commit_files({name: None for name in mine}, f"#{n} closed")
                  print(f"#{n}: deleted {', '.join(mine)}")

          def table(photo, url):
              label = photo.group(1)
              return (f"{MARK}\n\n"
                      f"| New photo | Google Street View |\n"
                      f"|---|---|\n"
                      f"| ![Photo of {label}]({photo.group(2)}) | ![Street View of {label}]({url}) |\n\n"
                      f"{END}")

          def plan(pr, body):
              """The photos still without Street View: [(photo match, image name,
              location)], with location None for a single-photo PR, whose page
              JSON has to be read for it."""
              n, todo = pr["number"], []
              sections = list(SECTION.finditer(body))
              if sections:
                  for s in sections:
                      if MARK in s.group(0):
                          continue
                      photo = PHOTO.search(body, s.start(), s.end())
                      if photo:
                          todo.append((photo, f"{n}-{slug(s.group(1))}.jpg", s.group(2)))
              elif MARK not in body:
                  photo = PHOTO.search(body)
                  if photo:
                      todo.append((photo, f"{n}.jpg", None))
              return todo

          def comparison(pr, body):
              n = pr["number"]
              todo = plan(pr, body)
              if not todo:
                  return body
              if not KEY:
                  print(f"#{n}: no STREET_VIEW_KEY secret, so no Street View comparison")
                  return body
              ensure_branch()
              have = branch_files() or set()
              new, ready = {}, []
              for photo, name, location in todo:
                  if name not in have:
                      location = location or single_photo_location(pr)
                      jpeg = street_view(location) if location else None
                      if not jpeg:
                          print(f"#{n}: no Street View for {name}")
                          continue
                      new[name] = jpeg
                  ready.append((photo, name))
              if new:
                  commit_files(new, f"Street View for #{n}: {', '.join(sorted(new))}")
              # Back to front, so the earlier matches' offsets still hold.
              for photo, name in sorted(ready, key=lambda r: r[0].start(), reverse=True):
                  body = (body[: photo.start()] + table(photo, IMAGES.format(name=name))
                          + body[photo.end():])
              return body

          # --- run -------------------------------------------------------

          def update(pr):
              n, body = pr["number"], pr.get("body") or ""
              updated = comparison(pr, preview_links(n, body))
              if updated == body:
                  print(f"#{n}: nothing to change")
                  return
              # Re-read just before writing: the app may have added a photo to
              # the body since, and its push will run this again for that one.
              if (api(f"repos/{REPO}/pulls/{n}").get("body") or "") != body:
                  print(f"#{n}: body changed while this ran; the next run will finish it")
                  return
              api(f"repos/{REPO}/pulls/{n}", "PATCH", {"body": updated})
              print(f"#{n}: body updated")

          if os.environ.get("PR"):
              n = os.environ["PR"]
              if os.environ.get("ACTION") == "closed":
                  delete_images(n)
              else:
                  update(api(f"repos/{REPO}/pulls/{n}"))
          else:
              for pr in pages(f"repos/{REPO}/pulls?state=open&per_page=100"):
                  if pr["head"]["ref"].startswith("photo/") and \
                     pr["head"]["repo"] and pr["head"]["repo"]["full_name"] == REPO:
                      update(pr)
