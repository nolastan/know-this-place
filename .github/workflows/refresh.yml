# Scheduled refresh of time-sensitive data (permits, assessments).
# Opens a single PR per run; human review still gates the merge.
name: refresh

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays ~7am Pacific
  workflow_dispatch:
    inputs:
      scope:
        description: "Path prefix to refresh (e.g. san-francisco/castro/castro-street). Empty = whole site."
        required: false
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the scheduled maintenance agent for knowthis.place.
            Follow AGENTS.md (root), the neighborhood AGENTS.md files, and
            shared/AGENTS.md.

            Scope: "${{ inputs.scope }}" (empty means the whole content tree
            under san-francisco/).

            Most pages are generated, so refreshing them is a script run, not a
            page-by-page reading job. Do NOT open pages one at a time to
            re-query them by hand — that costs enormously and the seeder does
            it in one pass.

            1. Generated pages (a `generator` key in their data.json). For each
               neighborhood in scope, re-run the seeder against live data:

                 python3 scripts/seed_pages.py seed --refresh \
                   --neighborhood "<analysis neighborhood>" \
                   --city <city-slug> --area <area-slug>

               It rewrites data.json and index.html wherever the city data
               moved, adds pages for parcels that have become seedable, and
               leaves hand-authored pages untouched. The Castro is
               "Castro/Upper Market" / san-francisco / castro.
            2. Hand-authored pages (no `generator` key) whose sources have
               `retrieved` dates older than 30 days: re-run the recorded
               queries, and where something material changed, update data.json
               and its index.html to match. If nothing changed, leave the page
               entirely alone — do NOT bump retrieved dates on a no-change
               page, it makes noise commits.
            3. Run `python3 scripts/validate.py` and
               `python3 scripts/build_sitemap.py`.
            4. Read `git diff --stat` and skim a few changed pages to confirm
               the changes are real data movement, not a generator regression.
            5. If any page changed: create branch refresh/<today's date>,
               commit, push, and open a single PR. Summarize by neighborhood
               (counts of pages added/updated) rather than listing a thousand
               paths, and call out anything that looked wrong.

            Never "verify" the Street View embed — its API key is restricted to
            the production domain and always fails elsewhere. See
            DATA-SOURCES.md.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch(domain:data.sfgov.org),Bash(python3:*),Bash(git:*),Bash(gh pr create:*)"
