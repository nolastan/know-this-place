# Scheduled refresh of time-sensitive data (permits, assessments).
# Opens a single PR per run; human review still gates the merge.
name: refresh

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays ~7am Pacific
  workflow_dispatch:
    inputs:
      scope:
        description: "Path prefix to refresh (e.g. san-francisco/castro/castro-street). Empty = whole site."
        required: false
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the scheduled maintenance agent for knowthis.place.
            Follow AGENTS.md (root), the neighborhood AGENTS.md files, and
            shared/AGENTS.md.

            Scope: "${{ inputs.scope }}" (empty means the whole content tree
            under san-francisco/).

            Refreshing a page means editing its data.json and re-rendering.
            `seed_pages.py seed` only writes pages that do not exist yet, so it
            is not a refresh tool — do not reach for it except in step 3.
            `seed_pages.py render` is: it rewrites index.html from data.json in
            place, and is what step 2 uses.

            1. Find address pages in scope whose data.json sources have
               `retrieved` dates older than 30 days. Work through them in
               batches, newest data first.
            2. For each, re-run the recorded queries against the sources in
               DATA-SOURCES.md. Where something material changed (a new permit,
               a changed status, a new assessment), update data.json and run
               `python3 scripts/seed_pages.py render <path>` — never open
               index.html. If nothing changed, leave the page entirely alone —
               do NOT bump retrieved dates on a no-change page, it makes noise
               commits.
            3. Optionally, pick up parcels that have newly become seedable
               (a new building, or one that has just appeared on the assessor's
               roll):

                 python3 scripts/seed_pages.py seed \
                   --neighborhood "<analysis neighborhood>" \
                   --city <city-slug> --area <area-slug>

               This adds pages that don't exist and touches nothing that does.
               The Castro is "Castro/Upper Market" / san-francisco / castro.
            4. Run `python3 scripts/build_sitemap.py`,
               `python3 scripts/build_map_index.py` and
               `python3 scripts/validate.py`.
            5. Read `git diff` and confirm each change is real data movement.
            6. If any page changed: create branch refresh/<today's date>,
               commit, push, and open a single PR listing every page updated
               and what changed. If nothing changed, stop without a PR.

            Budget: this job has limited turns. Prefer refreshing fewer pages
            properly over starting many and finishing none — the next run picks
            up whatever is still stale.

            Never "verify" the Street View embed — its API key is restricted to
            the production domain and always fails elsewhere. See
            DATA-SOURCES.md.

            This job refreshes city data only. Do not start a research pass,
            mine a corpus, or edit anything under research/ — that work is
            queued as `research` issues and run separately (research/AGENTS.md).
            A stale `retrieved` date on a secondary source is not something this
            job fixes.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch(domain:data.sfgov.org),Bash(python3:*),Bash(git:*),Bash(gh pr create:*)"
