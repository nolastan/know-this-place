# Build the site and publish it to GitHub Pages.
#
# The repository holds the sources — every `data.json`, every hub `index.md`,
# the stylesheet and the one enhancement script. It does not hold the site:
# 17,600 `index.html` files, `sitemap.xml`, `sitemaps/`,
# `shared/addresses.geojson`, `shared/nearby.json` and `/stats/` are all
# derived, and they are built here instead of being committed. Merging to
# `main` is still the deploy; this is what the deploy now runs.
#
# Pages must be set to "GitHub Actions" as its source (Settings → Pages →
# Build and deployment). On the legacy "deploy from a branch" setting this
# workflow's artifact is built and then ignored, and the branch — which no
# longer contains a single page — is what gets served.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the wait step below lists this run's artifacts
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Full history, no blobs: `scripts/build_stats.py` counts commits for
      # the dashboard and blanks four tiles rather than guess from a shallow
      # clone, but it never reads a file out of history — so the commit graph
      # is worth fetching and the old blobs are not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Build the site
        run: python3 scripts/build_site.py

      # After the build, not before: with the HTML uncommitted there is
      # nothing for the page contract to check until it exists.
      - name: Check the page contract
        run: python3 scripts/validate.py

      # What gets served is the working tree minus `.git` — the same set the
      # branch deploy served, which is what keeps this migration boring. The
      # stage step also stamps the stylesheet hash into the committed pages,
      # which carry an unhashed link so CSS changes don't conflict.
      - name: Stage the site
        run: python3 scripts/build_site.py --no-build --stage _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages looks the artifact up once, the instant upload finishes,
      # and fails if the run's artifact list doesn't show it yet. Since
      # 2026-11-25 that list lags the upload by a few seconds: every deploy
      # from #751 on uploaded fine and then found "0 artifact(s)", while the
      # same run listed it a minute later. Wait until it is listed.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                  --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" -gt 0 ]; then echo "listed after $((i * 5 - 5))s"; exit 0; fi
            sleep 5
          done
          echo "::warning::github-pages artifact still not listed after 5 minutes; trying the deploy anyway"

      - id: deploy
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and Seznam which pages this deploy changed, so they
      # recrawl them within hours (scripts/indexnow.py). After the deploy,
      # because the endpoint fetches the key file from the live site. The
      # last deploy's page fingerprints live in the Actions cache: a cache
      # entry can't be overwritten, so each run saves under its own key and
      # the next restores the newest by prefix. A lost cache costs one run
      # that sends only the homepage, never a failed deploy.
      - name: Restore the last deploy's page fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/fingerprints.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Ping IndexNow with the changed pages
        continue-on-error: true
        run: |
          mkdir -p .indexnow
          python3 scripts/indexnow.py _site \
            --previous .indexnow/fingerprints.json --out .indexnow/fingerprints.json

      - name: Save this deploy's page fingerprints
        if: hashFiles('.indexnow/fingerprints.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow/fingerprints.json
          key: indexnow-${{ github.run_id }}
