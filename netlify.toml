# Netlify — deploy previews only.
#
# Production stays on GitHub Pages (.github/workflows/deploy.yml). Netlify
# builds every pull request, and any branch it is told to, the same way that
# workflow does, so a change can be looked at before it is merged.
#
# The build mirrors deploy.yml: run the builders, check the page contract,
# then stage the working tree minus `.git` into `_site/` and publish that.
# Publishing `.` would ship the repository's history, and would skip the stage
# step's stamping of the stylesheet hash into the committed pages.

[build]
  command = """
    python3 scripts/build_site.py \
    && python3 scripts/validate.py \
    && python3 scripts/build_site.py --no-build --stage _site
  """
  publish = "_site"

  # Exit 0 skips the build, exit 1 runs it. Skipped:
  #
  # - Production. main is served by GitHub Pages, and a second production copy
  #   on *.netlify.app would only cost credits. Checked by branch as well as
  #   by context, so a build of main is skipped however it was started.
  # - Know This Photo PRs (`photo/` branches). The app pushes one commit per
  #   photo, 40-odd a session, and each was a full build of the site.
  #   .github/workflows/photo-preview.yml builds them in Actions instead, once
  #   the photos stop coming, and uploads that one preview here.
  ignore = '''
    [ "$CONTEXT" = "production" ] && exit 0
    [ "$BRANCH" = "main" ] && exit 0
    case "$HEAD" in photo/*) exit 0 ;; esac
    exit 1
  '''
